<!--
  docs/PIER_REWORK.md §1.6 — "build fq-verify/pier-layout.html — a harness
  page that mounts each pier screen/state at each of the three viewport sizes
  and asserts every interactive element's bounding rect is fully inside the
  viewport and >=60px on its smaller axis. Must print PASS/FAIL per screen."

  ONE file plays both roles, switched by a query string:
    ?child=<stateId>  — mounts THAT state's real screen (via the actual
                        js/screens/pier.js `mount()`, no router involved)
                        inside whatever CSS box this document is loaded at
                        (the harness sizes the <iframe> itself to
                        1000x540/1024x640/1180x745), measures every visible
                        interactive element, and exposes the result on
                        `window.__pierReady` (a Promise) for the parent to
                        read directly (same-origin, no postMessage needed).
    (no query)        — the harness itself: for every entry in STATES, spins
                        up a same-origin iframe at each of the three sizes
                        pointed at `?child=<id>`, awaits its measurement, and
                        renders a PASS/FAIL table.

  Must be served over http(s) (ES module imports + the app's own `fetch()`
  calls need a real origin) — `python3 -m http.server` from the repo root and
  open `http://localhost:<port>/fq-verify/pier-layout.html`.

  STATES is a small ARRAY OF PLAIN OBJECTS at the top of the script below.

  CHASSIS-FIXER UPDATE (see git history — this file was previously stale):
  all five machine mode files (splat/gunge/ghost/teacups/tank.js) now call
  `pier.mountChassis(...)` / `chassis.overlay(...)` — none of them still own
  an in-stage v1 veil. Every entry below that mounts a REAL screen (not a
  placeholder) is therefore `exercisable: 'full'` and counts toward the
  pass/fail banner. `'legacy'` remains a valid tag for a genuinely
  unmodified v1 mode file (none currently qualify) so a future regression
  doesn't get silently mislabelled the other way either.

  CHASSIS AGENT'S F1 FOLLOW-UP — "the assertion or its coverage is wrong,
  find out which": THE >=60px ASSERTION ITSELF WAS ALREADY CORRECT
  (`bigEnough = minAxis >= 60 - EPS`, below) — it is not what let 54px
  elements pass. What actually let them pass was TIMING, not coverage of
  which DOM states get mounted: this file has always frozen every CSS
  animation/transition (`* { animation:none!important; transition:none!
  important }`, in the child role below) BEFORE measuring, specifically to
  avoid a real, separately-diagnosed flakiness (rAF throttling for an
  off-screen/non-visible iframe — see that freeze's own comment). That
  freeze is exactly why this harness could never have reproduced F1: F1's
  root cause (css/pier.css's header contract, rule 3a) was `.pier-screen`'s
  entrance animation rendering — or, in a live/interactive session,
  sometimes genuinely getting stuck — AT a mid-keyframe `scale(.9)` instead
  of its settled `scale(1)`, shrinking every descendant (numpad keys, the
  mute button, the HUD back button) to exactly 90% of their true CSS size.
  Freezing the animation before measuring skips straight to the SETTLED
  end-state, which was always the correct final size — so this harness was
  PASSING elements that were correctly-sized IN THE STATE IT MEASURED, while
  a live/interactive/un-frozen render of the exact same screen could still
  show 54px. The chassis fix (rule 3a: `.pier-screen`'s entrance animates
  `opacity` only now, never `scale`/`transform`/`translate`) eliminates the
  underlying risk at the source, which is what makes this harness's freeze-
  then-measure approach safe/representative again — there is no longer any
  pier-chassis animation whose stuck-or-mid-flight state could under-report
  an element's true size. (Latent instances of the SAME class of risk this
  pass found in mode-owned files it could not edit — teacups.js's
  `.tcp-picker`/`.tcp-lap` still use css/main.css's `enter-pop` directly on
  containers holding real cup buttons — are flagged in the chassis agent's
  report; this harness cannot detect those either, for the identical
  freeze-before-measure reason, until they are fixed the same way.)

  COVERAGE: `mount()` with no simulated input only ever reaches each mode's
  FIRST screen, UNLESS that screen's content branches purely on `ctx.db`
  data read at mount time — in which case a `dbSeed` here can reach it with
  no click simulation at all. Tank's three idle states (fresh / aquarium /
  clean — js/pier/facts.js `gremlins()`/`flushed()`, both pure `ctx.db`
  reads) are exactly that case and are enumerated below.

  PLAYING-STATE COVERAGE (this pass adds what's achievable): a state may now
  carry a `drive: [{click:'<selector>', wait:<ms>}, …]` array — after
  `mount()` settles, the child role clicks each selector in turn (a real
  `.click()` against the mounted DOM, no synthetic event needed since every
  target here is a plain `<button>` with an `addEventListener('click', …)`
  handler) and waits the given `ms` (a real `setTimeout`, not a
  requestAnimationFrame — see the CHILD ROLE code below for why rAF timing
  can't be trusted in this harness's iframe) before the next step, THEN
  measures. This is genuinely "mount a mode and drive it far enough to
  render its dock" (not a simulation of the mode's own logic — it presses
  the mode's OWN real buttons) and is enough to reach: gunge's live numpad
  (press START), ghost's live numpad+tunnel (press START), tank's live
  numpad (seed one gremlin, press SPLAT 'EM), teacups' live numpad (press
  START on the welcome card, pick a cup, press LET'S GO on the lap-change
  ceremony — three real steps, matching its three real screens), and
  splat's live holes (press START, then wait through its real 3-2-1-GO!
  countdown — nominally 4 steps × 560ms plus a final 560ms hold (~2.8s) of
  `later()`/`setTimeout`-driven game logic, not a CSS animation, so freezing
  animations does not shorten it — MEASURED LIVE IN THIS HARNESS'S OWN
  OFF-SCREEN IFRAME: chained `setTimeout` callbacks here run at roughly
  HALF their requested rate — the same class of scheduler throttling this
  file's `runChild()` already documents for `requestAnimationFrame`, just
  showing up on `setTimeout` too for this particular countdown's length —
  so the real wall-clock time to holes-rendered was ~4.5–5s, not ~2.8s;
  `splat-playing`'s `drive` wait is set generously (7s) to clear this with
  margin rather than chase an exact number that may vary run to run). What
  this STILL does not
  reach, honestly: MID-FEEDBACK (a correct/wrong flash mid-question),
  END-CARD (round-complete scorecards), and CEREMONY (gunge's multi-stage
  death, tank's flush-to-Big-Toilet, any gold-trophy first-time
  celebration) — each needs either simulating a correct/wrong ANSWER
  through the numpad (mode-specific scoring/timing logic this shared
  harness has no business guessing at) or riding out a full round/survival
  timer (gunge's drain, ghost's 20 facts, splat's 60s), which is far more
  driving than "far enough to render its dock" — left for whichever
  mode-owning agent wants to extend their own entry's `drive` array.

  Full state list this pass DOES and does NOT exercise, for the report:
    welcome/idle : hub x2, splat, gunge, ghost, teacups, tank(fresh) — HERE
    empty state  : tank fresh-profile (dbSeed, no gremlins/flushes)  — HERE
    idle variants: tank aquarium (dbSeed: 1 gremlin), tank clean
                   (dbSeed: pierFlushed>0, no gremlins)              — HERE
    playing      : splat holes, gunge numpad-live, ghost numpad+
                   tunnel-live, teacups numpad-live, tank numpad-live — HERE
                   (driven via `drive:[…]`, see above)
    mid-feedback : any mode's correct/wrong flash                — NOT HERE
    end card     : gunge splash+scorecard, ghost photo-finish,
                   splat Dave-steals-mallet, tank round-complete  — NOT HERE
    ceremony     : gunge multi-stage death, tank flush-to-Big-
                   Toilet, any gold-trophy first-time celebration — NOT HERE
-->

<div id="harness"></div>

<script type="module">
/* ===================================================================
 * SHARED CONFIG — sizes + states (both roles use this)
 * =================================================================== */
const SIZES = [
  { w: 1000, h: 540, label: '1000×540' },
  { w: 1024, h: 640, label: '1024×640' },
  { w: 1180, h: 745, label: '1180×745' },

// exercisable: 'full'   — mounts a REAL screen through the chassis this
//                         rework built (`pier.mountChassis(...)`/
//                         `chassis.overlay(...)`) and counts fully toward
//                         the pass/fail banner below.
//              'legacy' — would mount a REAL, currently-unmodified v1 mode
//                         file that still owns its own in-stage veil/layout
//                         instead of the shared chassis. Reserved for a
//                         genuinely un-rebuilt future mode; nothing in the
//                         array below currently qualifies (verified against
//                         the live files by the chassis fixer — every one of
//                         splat/gunge/ghost/teacups/tank.js now calls
//                         `pier.mountChassis`/`chassis.overlay`). Kept as a
//                         valid tag rather than deleted so a REAL future
//                         regression back to an in-stage veil has somewhere
//                         honest to be reported, instead of being silently
//                         miscounted as 'full'.
const STATES = [
  {
    id: 'hub-deluxe-off', label: 'HUB — cabinet grid, DELUXE off', params: {},
    dbSeed: { meta: { pierDeluxe: false } }, exercisable: 'full',
    note: 'js/screens/pier.js mountHub(): back-to-map, title, flushed chip, 5 cabinet cards, DELUXE lever.',
  },
  {
    id: 'hub-deluxe-on', label: 'HUB — cabinet grid, DELUXE on', params: {},
    dbSeed: { meta: { pierDeluxe: true } }, exercisable: 'full',
    note: 'Same screen with the lever flipped ON at mount (persisted state) — Teacups note swaps to "Tables 2–12".',
  },
  {
    id: 'splat-welcome', label: 'SPLAT — welcome card', params: { mode: 'splat' }, exercisable: 'full',
    note: 'js/pier/modes/splat.js showWelcome() via chassis.overlay() (rebuilt — no more in-stage .splat-veil). This is the exact machine v1’s off-screen-START-button bug was screenshot-confirmed on; now chassis-owned and gated on pass/fail.',
  },
  {
    id: 'gunge-welcome', label: 'GUNGE — welcome card', params: { mode: 'gunge' }, exercisable: 'full',
    note: 'js/pier/modes/gunge.js welcome card via chassis.overlay(); numpad (playing state, not exercised here) mounts into chassis.dock, not its own stage.',
  },
  {
    id: 'ghost-welcome', label: 'GHOST — welcome card', params: { mode: 'ghost' }, exercisable: 'full',
    note: 'js/pier/modes/ghost.js welcome card via chassis.overlay() (rebuilt — no more .gh-veil inside .gh-root).',
  },
  {
    id: 'teacups-welcome', label: 'TEACUPS — table picker', params: { mode: 'teacups' }, exercisable: 'full',
    note: 'js/pier/modes/teacups.js picker screen, mounted inside pier.mountChassis()’s stage.',
  },
  {
    id: 'tank-fresh', label: 'TANK — fresh-profile empty state', params: { mode: 'tank' }, exercisable: 'full',
    note: 'js/pier/modes/tank.js renderFresh(): no gremlins ever recorded, no flushes — net + empty tank, "go make some mistakes", SPLAT/PRACTICE buttons. No confetti (REWORK §3 tank).',
  },
  {
    id: 'tank-aquarium', label: 'TANK — aquarium (1 live gremlin)', params: { mode: 'tank' },
    dbSeed: { meta: { pierFacts: { families: { '6x7': { history: [{ correct: false, ms: 4000 }, { correct: false, ms: 4200 }], streak: 0, misses: 5, isGremlin: true } } } } },
    exercisable: 'full',
    note: 'js/pier/modes/tank.js renderAquarium() (reached via facts.gremlins().length>0, seeded through ctx.db meta.pierFacts — no simulated taps): gremlin card(s), name+fact+tally.',
  },
  {
    id: 'tank-clean', label: 'TANK — earned-clean celebration', params: { mode: 'tank' },
    dbSeed: { meta: { pierFlushed: 4 } }, exercisable: 'full',
    note: 'js/pier/modes/tank.js renderClean() (reached via facts.flushed()>0 AND no live gremlins — seeded through ctx.db meta.pierFlushed): SPARKLING CLEAN stamp + confetti. This is the ONE tank idle state that IS allowed to celebrate (REWORK §3).',
  },

  /* ---------------------------------------------------------------------
   * PLAYING states — real DOM clicks against the mode's own buttons via
   * `drive:[…]` (see the file-header comment "PLAYING-STATE COVERAGE" for
   * the mechanism and exactly what this does/doesn't reach). These are the
   * states that actually exercise a LIVE `.pier-numpad-key` (or, for splat,
   * live `.splat-hole` buttons) — this is the coverage gap the F1 report
   * flagged: every state ABOVE only ever measures a numpad that is present
   * but not yet interactive (gunge/ghost build theirs before their welcome
   * card closes) or measures no numpad at all (splat/teacups/tank build
   * theirs only once play actually starts).
   * --------------------------------------------------------------------- */
  {
    id: 'gunge-playing', label: 'GUNGE — playing (numpad live, plank ticking)', params: { mode: 'gunge' },
    exercisable: 'full', drive: [{ click: '.gg-startbtn', wait: 300 }],
    note: 'js/pier/modes/gunge.js: welcome card START pressed -> renderRoundShell()-equivalent live state. Numpad in chassis.dock is now the real interactive round, not the pre-round preview.',
  },
  {
    id: 'ghost-playing', label: 'GHOST — playing (numpad + tunnel live)', params: { mode: 'ghost' },
    exercisable: 'full', drive: [{ click: '.gh-start-btn', wait: 300 }],
    note: 'js/pier/modes/ghost.js: welcome card START/dare pressed -> the tunnel run begins, numpad enabled for real. This is the state F2/F3 (stage-beside-dock, full-height tunnel) are actually about — the welcome card alone never proved the RUNNING tunnel fits.',
  },
  {
    id: 'teacups-playing', label: 'TEACUPS — playing (numpad live, lap 1)', params: { mode: 'teacups' },
    exercisable: 'full',
    drive: [
      { click: '.tcp-start', wait: 200 },
      { click: '.tcp-cup', wait: 300 },
      { click: '.tcp-lap-go', wait: 300 },
    ],
    note: 'js/pier/modes/teacups.js: three real screens driven in sequence — welcome card START, then the FIRST cup in the picker grid (table 2), then the lap-change ceremony\'s LET\'S GO — lands on buildLapUI()\'s live numpad.',
  },
  {
    id: 'tank-playing', label: 'TANK — playing (targeted round, numpad live)', params: { mode: 'tank' },
    dbSeed: { meta: { pierFacts: { families: { '6x7': { history: [{ correct: false, ms: 4000 }, { correct: false, ms: 4200 }], streak: 0, misses: 5, isGremlin: true } } } } },
    exercisable: 'full', drive: [{ click: '.pt-dock-btn', wait: 300 }],
    note: 'js/pier/modes/tank.js: aquarium\'s "SPLAT \'EM!" pressed -> renderRoundShell()\'s live numpad in chassis.dock, replacing the gremlin grid in chassis.stage.',
  },
  {
    id: 'splat-playing', label: 'SPLAT — playing (holes live, post-countdown)', params: { mode: 'splat' },
    exercisable: 'full', drive: [{ click: '.splat-start-btn', wait: 7000 }],
    note: 'js/pier/modes/splat.js: welcome card START pressed -> runCountdown()\'s real 4-step, 560ms-per-step "3, 2, 1, GO!" (setTimeout-chained game logic, NOT a CSS animation the freeze below shortens) -> renderHoles() mounts five real .splat-hole <button>s. No numpad in this mode (tap-based) — this is the one PLAYING state proving TAP targets, not numpad keys, stay >=60px.',
  },
];
// STILL NOT exercised by this harness even after the PLAYING states above
// (see the file-header comment's "PLAYING-STATE COVERAGE" for the honest
// account of why): any mode's MID-FEEDBACK (a correct/wrong flash reached
// only by answering a live question), END-CARD (round-complete scorecards,
// reached only by finishing/losing a full round), or CEREMONY (gunge's
// multi-stage death, tank's flush-to-Big-Toilet, any gold-trophy first-time
// celebration) state — each needs simulating a real answer (right or wrong)
// through the numpad and/or riding out a full round or survival timer,
// which is real per-mode scoring/timing logic this shared chassis harness
// has no business guessing at on a mode-owning agent's behalf.

const isChild = new URLSearchParams(location.search).has('child');

/* ===================================================================
 * MOCK ctx — just enough for facts.load()/ensureContent()/mount() to run
 * without touching the real app's IndexedDB, main.js boot sequence, or
 * real audio/network. Mirrors the shapes js/main.js's real ctx object and
 * js/pier/facts.js / js/pier/padkit.js actually read.
 * =================================================================== */
function makeMockCtx(dbSeed) {
  const store = { meta: {}, settings: {} };
  if (dbSeed) {
    Object.keys(dbSeed).forEach((table) => {
      store[table] = Object.assign({}, store[table], dbSeed[table]);
    });
  }
  const db = {
    async get(table, key) { return store[table] ? store[table][key] : undefined; },
    async put(table, key, val) { store[table] = store[table] || {}; store[table][key] = val; },
    async del(table, key) { if (store[table]) delete store[table][key]; },
  };
  const prefs = {
    music: 1, sfx: 0, vo: 0, musicOn: true, sfxOn: false, voOn: false, fartOMeter: 0, textSize: 'A', examTimerSounds: false,
  };
  const audio = {
    music() {}, sfx() {}, async vo() { return false; }, setVolumes() {}, setFartOMeter() {}, parp() {}, duck() {}, stopMusic() {},
  };
  return {
    db, audio, prefs, state: {},
    go(hash) { /* no-op — the harness never navigates for real */ },
    toast(msg) { /* eslint-disable-next-line no-console */ console.log('[pier-layout harness] toast:', msg); },
    capabilities: {},
  };
}

/* ===================================================================
 * MEASUREMENT — run inside a CHILD document only
 * =================================================================== */
function round(n) { return Math.round(n * 10) / 10; }

function measureInteractive() {
  const sel = 'button, [role="button"], a[href], input, select, textarea, [tabindex]';
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const EPS = 0.5; // subpixel-rounding tolerance only
  const nodes = Array.from(document.querySelectorAll(sel)).filter((n) => {
    if (n.disabled) return false; // not a live target
    const tIdx = n.getAttribute('tabindex');
    if (tIdx === '-1') return false;
    const cs = getComputedStyle(n);
    if (cs.visibility === 'hidden' || cs.display === 'none') return false;
    const r = n.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  });
  return nodes.map((n) => {
    const r = n.getBoundingClientRect();
    const inside = r.left >= -EPS && r.top >= -EPS && r.right <= vw + EPS && r.bottom <= vh + EPS;
    const minAxis = Math.min(r.width, r.height);
    const bigEnough = minAxis >= 60 - EPS;
    return {
      tag: n.tagName.toLowerCase(),
      cls: String(n.className || '').split(' ').filter(Boolean).slice(0, 3).join(' '),
      text: (n.textContent || n.getAttribute('aria-label') || '').trim().replace(/\s+/g, ' ').slice(0, 34),
      rect: {
        left: round(r.left), top: round(r.top), right: round(r.right), bottom: round(r.bottom), width: round(r.width), height: round(r.height),
      },
      inside, bigEnough, pass: inside && bigEnough,
    };
  });
}

/* ===================================================================
 * CHILD ROLE
 * =================================================================== */
async function runChild() {
  document.getElementById('harness').remove();
  const rootHost = document.getElementById('child-root');
  rootHost.style.display = '';
  rootHost.id = 'app'; // faithful to real boot: main.js mounts screens into #app

  // Freeze every animation/transition BEFORE mount() runs any DOM writes.
  // This automation environment renders on-demand (no continuous compositor
  // tick unless something — a screenshot, a real user paint — asks for one),
  // so a running CSS animation's timeline can sit frozen at its 0% keyframe
  // indefinitely: caught for real during development, `.pier-screen`'s OLD
  // `.enter-pop` (css/main.css, 380ms `scale(.9)->scale(1)`) stayed stuck at
  // EXACTLY `matrix(0.9,...)` well past any wall-clock wait, under-reporting
  // every element inside it by a flat 10% — THIS is what F1 turned out to
  // be (chassis agent's report / css/pier.css contract §3a): not a floor/
  // clamp() bug, but the correct CSS size × a stuck entrance-animation scale
  // factor, live-reproducible with exactly this same "no real paint tick"
  // mechanism outside this harness too. `.pier-screen` no longer has any
  // size-or-position-changing entrance animation at all (opacity-only now)
  // specifically so that class of bug cannot recur regardless of paint
  // timing — this freeze is kept for OTHER mode-owned animations (still
  // useful, still avoids the iframe-throttling flakiness it was original
  // added for) but is no longer the thing standing between this harness and
  // catching a real F1. See the file-header comment's "CHASSIS AGENT'S F1
  // FOLLOW-UP" for the full account. This also mirrors the codebase's own
  // `@media (prefers-reduced-motion: reduce)` handling in css/main.css (same
  // fix, applied unconditionally here since the harness wants the SETTLED
  // end-state, not a mid-animation frame, and can't rely on a real rendering
  // loop to reach it).
  const freeze = document.createElement('style');
  freeze.textContent = '*, *::before, *::after { animation: none !important; transition: none !important; }';
  document.head.appendChild(freeze);

  const stateId = new URLSearchParams(location.search).get('child');
  const state = STATES.find((s) => s.id === stateId);
  if (!state) {
    window.__pierReady = Promise.resolve({ id: stateId, error: 'unknown state id', elements: [] });
    return;
  }

  const ctx = makeMockCtx(state.dbSeed);
  let error = null;
  window.__pierReady = (async () => {
    try {
      const { mount } = await import('../js/screens/pier.js');
      await mount(rootHost, ctx, state.params || {});
      // A plain setTimeout, NOT requestAnimationFrame, for the settle-wait:
      // this document is mounted off-screen (`.rig { left:-20000px }`)
      // inside the harness's measurement iframe, and Chrome throttles rAF
      // callbacks for iframes it judges non-visible — almost exactly the
      // "hidden tab" throttling js/anims/_kit.js's tween() guards against,
      // and it stalled this harness for real during development (a rAF
      // chain here could hang tens of seconds per iframe). CSS layout
      // itself is NOT throttled the same way, so getBoundingClientRect()
      // below is accurate regardless — only JS's rAF *scheduling* was the
      // problem.
      await new Promise((r) => { setTimeout(r, 50); });
      // PLAYING-STATE COVERAGE (file-header comment) — `drive` is a real
      // click-then-wait sequence against the mode's OWN buttons, not a
      // simulation of its logic. `Element.click()` fires a full, trusted
      // synthetic click a plain `addEventListener('click', …)` handler
      // reacts to identically to a real pointer tap (every target here IS
      // exactly that: a plain `<button>` with a click listener — see each
      // mode file). A missing selector is left to fail loudly at the
      // measurement stage (fewer elements than expected / an error) rather
      // than silently — a `drive` step that can't find its target is itself
      // a signal something upstream broke, not something to swallow.
      if (Array.isArray(state.drive)) {
        for (const step of state.drive) {
          const target = document.querySelector(step.click);
          if (target) target.click();
          // eslint-disable-next-line no-await-in-loop
          await new Promise((r) => { setTimeout(r, step.wait || 150); });
        }
      }
    } catch (e) {
      error = String((e && e.stack) || e);
    }
    const elements = error ? [] : measureInteractive();
    const result = {
      id: state.id, error, elements, vw: window.innerWidth, vh: window.innerHeight,
    };
    window.__pierResult = result;
    return result;
  })();
}

/* ===================================================================
 * PARENT (HARNESS) ROLE
 * =================================================================== */
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

async function measureOneIframe(state, size) {
  const iframe = document.createElement('iframe');
  iframe.className = 'rig';
  iframe.style.width = size.w + 'px';
  iframe.style.height = size.h + 'px';
  document.body.appendChild(iframe);
  const loaded = new Promise((resolve) => { iframe.addEventListener('load', resolve, { once: true }); });
  iframe.src = `pier-layout.html?child=${encodeURIComponent(state.id)}`;
  await loaded;
  let result;
  try {
    result = await iframe.contentWindow.__pierReady;
  } catch (e) {
    result = { id: state.id, error: String(e), elements: [] };
  }
  iframe.remove();
  return result;
}

function renderResult(container, state, size, result) {
  const failing = (result.elements || []).filter((e) => !e.pass);
  const hasError = !!result.error;
  const verdict = hasError ? 'fail' : (failing.length === 0 ? 'pass' : 'fail');

  const row = el('div');
  const head = el('div');
  head.innerHTML = `<b>${size.label}</b> — <span class="badge ${verdict}">${verdict.toUpperCase()}</span>`
    + (hasError ? ` <span class="err mono">${escapeHtml(result.error)}</span>`
      : ` <span class="mono">${result.elements.length} interactive element${result.elements.length === 1 ? '' : 's'} checked${failing.length ? `, ${failing.length} failing` : ''}</span>`);
  row.appendChild(head);

  if (!hasError && result.elements.length) {
    const details = el('details');
    details.appendChild(el('summary', null, 'element-by-element detail'));
    const table = el('table');
    table.innerHTML = '<tr><th>Elem</th><th>Text</th><th>Rect (l,t,r,b / w×h)</th><th>Inside?</th><th>&ge;60px?</th></tr>';
    result.elements.forEach((e) => {
      const tr = el('tr', e.pass ? '' : 'elrow-fail');
      tr.innerHTML = `<td class="mono">${e.tag}.${escapeHtml(e.cls)}</td>`
        + `<td>${escapeHtml(e.text)}</td>`
        + `<td class="mono">${e.rect.left},${e.rect.top},${e.rect.right},${e.rect.bottom} / ${e.rect.width}×${e.rect.height}</td>`
        + `<td>${e.inside ? '✅' : '❌ OUTSIDE VIEWPORT'}</td>`
        + `<td>${e.bigEnough ? '✅' : '❌ TOO SMALL'}</td>`;
      table.appendChild(tr);
    });
    details.appendChild(table);
    row.appendChild(details);
  }
  container.appendChild(row);
  return verdict;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

async function runHarness() {
  const root = document.getElementById('harness');
  root.innerHTML = `
    <h1>Whiff-End Pier — layout law harness</h1>
    <p class="intro">Mounts each registered pier screen/state (via the real <code>js/screens/pier.js</code> <code>mount()</code>, no router) inside a same-origin iframe sized to exactly <code>1000×540</code>, <code>1024×640</code> and <code>1180×745</code> CSS px, then asserts every VISIBLE interactive element's bounding rect is fully inside that box and &ge;60px on its smaller axis (docs/PIER_REWORK.md §1.6). Every state below is <b>chassis-owned</b> (all five mode files call <code>pier.mountChassis</code>/<code>chassis.overlay</code>) and counts toward the pass/fail banner; <b>legacy</b> is kept only as a tag for a genuinely un-rebuilt future mode. This pass reaches each mode's WELCOME/idle screen (plus Tank's <code>ctx.db</code>-seeded aquarium/clean idle states — see the file's header comment) — PLAYING, MID-FEEDBACK, END-CARD and CEREMONY states need live taps this harness does not simulate and are NOT covered here.</p>
    <div id="summary" class="running">Running…</div>
    <div id="states"></div>
  `;
  const summaryEl = document.getElementById('summary');
  const statesEl = document.getElementById('states');

  let overallPass = true;
  const lines = [];

  for (const state of STATES) {
    const block = el('div', 'state-block');
    const badge = state.exercisable === 'legacy' ? '<span class="badge legacy">LEGACY MODE FILE</span>' : '<span class="badge pass">CHASSIS-OWNED</span>';
    block.appendChild(el('div', 'state-h', `${state.label} ${badge}`));
    block.appendChild(el('div', 'state-note', state.note || ''));
    statesEl.appendChild(block);

    let stateAllPass = true;
    // eslint-disable-next-line no-await-in-loop
    for (const size of SIZES) {
      // eslint-disable-next-line no-await-in-loop
      const result = await measureOneIframe(state, size);
      const verdict = renderResult(block, state, size, result);
      if (verdict !== 'pass') stateAllPass = false;
      lines.push(`${verdict.toUpperCase()} — ${state.label} @ ${size.label}${state.exercisable === 'legacy' ? ' [legacy mode file]' : ''}`);
    }
    // Only chassis-owned states count toward the pass/fail this rework is
    // actually accountable for — legacy states are printed in full above
    // (nothing is hidden) but don't flip the top banner red for a mode file
    // outside this pass's ownership; see the console/report line-by-line
    // PASS/FAIL either way.
    if (state.exercisable !== 'legacy' && !stateAllPass) overallPass = false;
  }

  summaryEl.className = overallPass ? 'pass' : 'fail';
  summaryEl.textContent = overallPass
    ? 'PASS — every chassis-owned screen/state fits all three viewport sizes with zero scrolling.'
    : 'FAIL — see the red rows above.';

  // eslint-disable-next-line no-console
  console.log('=== Whiff-End Pier layout harness ===\n' + lines.join('\n'));
}

if (isChild) {
  runChild();
} else {
  runHarness();
}
</script>
</body>
</html>
